# Weekly update pull requests (docs/security.md#dependency-vulnerabilities). Minor and patch
# updates are grouped into one pull request per app; major upgrades are deliberate projects
# (an Expo SDK, Spring Boot, Next.js) and are left out.
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      web:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /apps/mobile
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      mobile:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Expo pins these to the SDK (expo/bundledNativeModules.json). Bumping them one by one
      # leaves the app out of step with the SDK; update them together with
      # `npx expo install expo@~<version> --fix` instead (docs/security.md).
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "jest-expo"
      - dependency-name: "eslint-config-expo"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@sentry/react-native"

  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      backend:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: docker
    directories: [/backend, /apps/web]
    schedule: { interval: weekly, day: monday }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The maven tag names the JDK (3.9-eclipse-temurin-21), which Dependabot treats as a suffix
      # and would move to a non-LTS Java. JDK and Node.js upgrades are deliberate; change the
      # Dockerfiles by hand.
      - dependency-name: "maven"
