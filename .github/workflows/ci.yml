name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint openapi.yaml
        run: npx --yes @redocly/cli@latest lint api/openapi.yaml --config api/redocly.yaml
      - name: Generated client types are up to date
        run: |
          (cd apps/web && npm ci && npm run api:generate)
          (cd apps/mobile && npm ci && npm run api:generate)
          git diff --exit-code -- apps/web/src/api apps/mobile/src/api

  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Unit tests, Spring Modulith boundary checks, contract test and the end-to-end flow
      # (Testcontainers starts PostgreSQL; GitHub runners have Docker).
      - run: mvn -B -f backend/pom.xml verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modulith-docs
          path: backend/target/spring-modulith-docs

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  mobile:
    name: Mobile (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint src --max-warnings=0
      - run: npm test -- --ci
      - name: Bundle Android JS (catches import/resolution errors)
        run: npx expo export --platform android --output-dir dist
