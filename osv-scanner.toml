# Vulnerabilities accepted for now, checked by .github/workflows/dependency-scan.yml.
# Add an entry only when no fixed version can be used yet; give the reason and an expiry date
# (90 days at most). When the date passes the scan fails again, so the decision is reviewed.
# See docs/security.md#dependency-vulnerabilities.

[[IgnoredVulns]]
id = "GHSA-mrhx-c7xc-m3w5"
ignoreUntil = 2027-01-31
reason = """\
  zod 3.25 (memory exhaustion validating oversized collections), used only by the Expo command-line \
  tool (@expo/cli) at build time, on our own project files. Fixed only in zod 4, which @expo/cli \
  does not support. Revisit with the next Expo SDK."""

[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
ignoreUntil = 2027-01-31
reason = """\
  deepmerge 4.3.1 (prototype poisoning), used by @expo/config at build time to merge our own app \
  config. No fixed version is published. Revisit with the next Expo SDK or a deepmerge release."""
