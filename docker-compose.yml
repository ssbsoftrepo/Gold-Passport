# Local stack: PostgreSQL + backend (local profile, demo data) + web.
#   docker compose up --build            -> web on http://localhost:3000, API on http://localhost:8080
#   docker compose up -d postgres        -> only the database (run backend/web from your IDE)
#   docker compose --profile aws up -d localstack   -> S3/SNS emulation for the AWS adapters
name: gold-passport

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: goldpassport
      POSTGRES_USER: goldpassport
      POSTGRES_PASSWORD: goldpassport
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goldpassport -d goldpassport"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/goldpassport
      DB_USERNAME: goldpassport
      DB_PASSWORD: goldpassport
      PMD_STORAGE_LOCAL_DIR: /app/data/storage
    ports:
      - "8080:8080"
    volumes:
      - storage:/app/data

  web:
    build:
      context: apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    depends_on:
      - backend
    ports:
      - "3000:3000"

  localstack:
    profiles: ["aws"]
    image: localstack/localstack:4
    environment:
      SERVICES: s3,sns
    ports:
      - "4566:4566"
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro

volumes:
  pgdata:
  storage:
